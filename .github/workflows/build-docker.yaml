name: Build and Push Docker Images

on:
  push:
    branches:
      - main  # Runs automatically when you push to main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. Download your code
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Setup Java 21
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    # 3. Compile and build the Spring Boot JAR files
    - name: Compile and Package Services
      run: |
        mvn clean package -DskipTests

    # 4. Log in to Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 5. Build the Docker image and upload it to Docker Hub
    - name: Build and Push Discovery Server Image
      uses: docker/build-push-action@v5
      with:
        context: ./discovery-server
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/discovery-server:latest