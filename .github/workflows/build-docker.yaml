name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    # Build all Java backend services individually
    - name: Compile and Package Services
      run: |
        mvn clean package -DskipTests -f discovery-server/pom.xml
        mvn clean package -DskipTests -f config-server/pom.xml
        mvn clean package -DskipTests -f api-gateway/pom.xml
        mvn clean package -DskipTests -f auth-service/pom.xml
        mvn clean package -DskipTests -f ticket-service/pom.xml
        mvn clean package -DskipTests -f attachment-service/pom.xml
        mvn clean package -DskipTests -f notification-service/pom.xml

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 1. Push Discovery Server
    - name: Push Discovery Server
      uses: docker/build-push-action@v5
      with:
        context: ./discovery-server
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/discovery-server:latest

    # 2. Push Config Server
    - name: Push Config Server
      uses: docker/build-push-action@v5
      with:
        context: ./config-server
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/config-server:latest

    # 3. Push API Gateway
    - name: Push API Gateway
      uses: docker/build-push-action@v5
      with:
        context: ./api-gateway
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest

    # 4. Push Auth Service
    - name: Push Auth Service
      uses: docker/build-push-action@v5
      with:
        context: ./auth-service
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/auth-service:latest

    # 5. Push Ticket Service
    - name: Push Ticket Service
      uses: docker/build-push-action@v5
      with:
        context: ./ticket-service
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/ticket-service:latest

    # 6. Push Attachment Service
    - name: Push Attachment Service
      uses: docker/build-push-action@v5
      with:
        context: ./attachment-service
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/attachment-service:latest

    # 7. Push Notification Service
    - name: Push Notification Service
      uses: docker/build-push-action@v5
      with:
        context: ./notification-service
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/notification-service:latest

    # 8. Push React Frontend UI
    - name: Push React Frontend UI
      uses: docker/build-push-action@v5
      with:
        context: ./ticketdesk-ui
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/ticketdesk-ui:latest