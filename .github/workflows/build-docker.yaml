name: Build, Push and Deploy Infrastructure

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      terraform_action:
        description: 'Terraform Action to perform'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    # Permission to write/commit the state file back to the repo
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    # 1. Configure AWS Credentials
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    # 2. Log in to Amazon ECR
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # 3. Create ECR repositories automatically if they do not exist
    - name: Create ECR Repositories if missing
      run: |
        for repo in discovery-server config-server api-gateway auth-service ticket-service attachment-service notification-service ticketdesk-ui; do
          aws ecr describe-repositories --repository-names $repo --region ${{ secrets.AWS_REGION }} || aws ecr create-repository --repository-name $repo --region ${{ secrets.AWS_REGION }}
        done

    # 4. Get the Git Commit SHA for traceable tagging
    - name: Get Commit SHA
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    # 5. Build Java jar files (Only runs during 'apply')
    - name: Set up JDK 21
      if: ${{ github.event.inputs.terraform_action != 'destroy' }}
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Compile and Package Services
      if: ${{ github.event.inputs.terraform_action != 'destroy' }}
      run: |
        mvn clean package -DskipTests -f discovery-server/pom.xml
        mvn clean package -DskipTests -f config-server/pom.xml
        mvn clean package -DskipTests -f api-gateway/pom.xml
        mvn clean package -DskipTests -f auth-service/pom.xml
        mvn clean package -DskipTests -f ticket-service/pom.xml
        mvn clean package -DskipTests -f attachment-service/pom.xml
        mvn clean package -DskipTests -f notification-service/pom.xml

    # 6. Build and Push images to Amazon ECR (Only runs during 'apply')
    - name: Build and Push Docker Images
      if: ${{ github.event.inputs.terraform_action != 'destroy' }}
      run: |
        docker build -t ${{ steps.login-ecr.outputs.registry }}/discovery-server:${{ steps.vars.outputs.sha_short }} ./discovery-server
        docker push ${{ steps.login-ecr.outputs.registry }}/discovery-server:${{ steps.vars.outputs.sha_short }}

        # FIXED: Context set to '.' (root) so Docker can access config-repo and config-server/pom.xml
        docker build -t ${{ steps.login-ecr.outputs.registry }}/config-server:${{ steps.vars.outputs.sha_short }} -f ./config-server/Dockerfile .
        docker push ${{ steps.login-ecr.outputs.registry }}/config-server:${{ steps.vars.outputs.sha_short }}

        docker build -t ${{ steps.login-ecr.outputs.registry }}/api-gateway:${{ steps.vars.outputs.sha_short }} ./api-gateway
        docker push ${{ steps.login-ecr.outputs.registry }}/api-gateway:${{ steps.vars.outputs.sha_short }}

        docker build -t ${{ steps.login-ecr.outputs.registry }}/auth-service:${{ steps.vars.outputs.sha_short }} ./auth-service
        docker push ${{ steps.login-ecr.outputs.registry }}/auth-service:${{ steps.vars.outputs.sha_short }}

        docker build -t ${{ steps.login-ecr.outputs.registry }}/ticket-service:${{ steps.vars.outputs.sha_short }} ./ticket-service
        docker push ${{ steps.login-ecr.outputs.registry }}/ticket-service:${{ steps.vars.outputs.sha_short }}

        docker build -t ${{ steps.login-ecr.outputs.registry }}/attachment-service:${{ steps.vars.outputs.sha_short }} ./attachment-service
        docker push ${{ steps.login-ecr.outputs.registry }}/attachment-service:${{ steps.vars.outputs.sha_short }}

        docker build -t ${{ steps.login-ecr.outputs.registry }}/notification-service:${{ steps.vars.outputs.sha_short }} ./notification-service
        docker push ${{ steps.login-ecr.outputs.registry }}/notification-service:${{ steps.vars.outputs.sha_short }}

        docker build -t ${{ steps.login-ecr.outputs.registry }}/ticketdesk-ui:${{ steps.vars.outputs.sha_short }} ./ticketdesk-ui
        docker push ${{ steps.login-ecr.outputs.registry }}/ticketdesk-ui:${{ steps.vars.outputs.sha_short }}

    # 7. Initialize Terraform
    - name: Terraform Init
      run: |
        cd terraform
        terraform init

    # 8. Run Terraform Apply or Destroy
    - name: Run Terraform Action
      run: |
        cd terraform
        ACTION="${{ github.event.inputs.terraform_action }}"
        if [ -z "$ACTION" ]; then
          ACTION="apply"
        fi
        
        if [ "$ACTION" == "destroy" ]; then
          terraform destroy -auto-approve -var="image_tag=${{ steps.vars.outputs.sha_short }}"
        else
          terraform apply -auto-approve -var="image_tag=${{ steps.vars.outputs.sha_short }}"
        fi

    # 9. Commit the updated state file back to the repository
    - name: Commit State File
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add terraform/terraform.tfstate || true
        git commit -m "Update Terraform state [skip ci]" || true
        git push || true