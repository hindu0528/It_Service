name: Build and Push all Services to Amazon ECR

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # 1. Configure AWS Credentials
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    # 2. Log in to Amazon ECR
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # 3. Create ECR repositories automatically if they do not exist
    - name: Create ECR Repositories if missing
      run: |
        for repo in discovery-server config-server api-gateway auth-service ticket-service attachment-service notification-service ticketdesk-ui; do
          aws ecr describe-repositories --repository-names $repo --region ${{ secrets.AWS_REGION }} || aws ecr create-repository --repository-name $repo --region ${{ secrets.AWS_REGION }}
        done

    # 4. Get the Git Commit SHA for traceable tagging
    - name: Get Commit SHA
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    # 5. Build Java jar files
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Compile and Package Services
      run: |
        mvn clean package -DskipTests -f discovery-server/pom.xml
        mvn clean package -DskipTests -f config-server/pom.xml
        mvn clean package -DskipTests -f api-gateway/pom.xml
        mvn clean package -DskipTests -f auth-service/pom.xml
        mvn clean package -DskipTests -f ticket-service/pom.xml
        mvn clean package -DskipTests -f attachment-service/pom.xml
        mvn clean package -DskipTests -f notification-service/pom.xml

    # 6. Build and Push images to Amazon ECR
    - name: Build and Push Discovery Server
      uses: docker/build-push-action@v5
      with:
        context: ./discovery-server
        push: true
        tags: ${{ steps.login-ecr.outputs.registry }}/discovery-server:${{ steps.vars.outputs.sha_short }}

    - name: Build and Push Config Server
      uses: docker/build-push-action@v5
      with:
        context: ./config-server
        push: true
        tags: ${{ steps.login-ecr.outputs.registry }}/config-server:${{ steps.vars.outputs.sha_short }}

    - name: Build and Push API Gateway
      uses: docker/build-push-action@v5
      with:
        context: ./api-gateway
        push: true
        tags: ${{ steps.login-ecr.outputs.registry }}/api-gateway:${{ steps.vars.outputs.sha_short }}

    - name: Build and Push Auth Service
      uses: docker/build-push-action@v5
      with:
        context: ./auth-service
        push: true
        tags: ${{ steps.login-ecr.outputs.registry }}/auth-service:${{ steps.vars.outputs.sha_short }}

    - name: Build and Push Ticket Service
      uses: docker/build-push-action@v5
      with:
        context: ./ticket-service
        push: true
        tags: ${{ steps.login-ecr.outputs.registry }}/ticket-service:${{ steps.vars.outputs.sha_short }}

    - name: Build and Push Attachment Service
      uses: docker/build-push-action@v5
      with:
        context: ./attachment-service
        push: true
        tags: ${{ steps.login-ecr.outputs.registry }}/attachment-service:${{ steps.vars.outputs.sha_short }}

    - name: Build and Push Notification Service
      uses: docker/build-push-action@v5
      with:
        context: ./notification-service
        push: true
        tags: ${{ steps.login-ecr.outputs.registry }}/notification-service:${{ steps.vars.outputs.sha_short }}

    - name: Build and Push React Frontend UI
      uses: docker/build-push-action@v5
      with:
        context: ./ticketdesk-ui
        push: true
        tags: ${{ steps.login-ecr.outputs.registry }}/ticketdesk-ui:${{ steps.vars.outputs.sha_short }}