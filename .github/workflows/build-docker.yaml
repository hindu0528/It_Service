name: Build, Push, and Deploy System

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      terraform_action:
        description: 'Terraform Action to perform'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    # 1. Secret scanning (M6 Requirement)
    - name: Scan for Committed Secrets
      uses: trufflesecurity/trufflehog@main
      with:
        extra_args: --only-verified
        path: ./

    # 2. Configure AWS Credentials
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    # 3. Setup Terraform
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.15.8"

    # Install Node.js dependencies for Lambda thumbnail generator
    - name: Install Lambda dependencies
      run: |
        cd lambda
        npm install

    # 4. Terraform Init & Extract S3 Bucket Output
    - name: Terraform Init & Plan
      id: tf_setup
      run: |
        cd terraform
        terraform init
        
    # 5. Build Java Jars & Run Unit Tests (M6 Requirement)
    - name: Set up JDK 21
      if: ${{ github.event_name == 'push' || github.event.inputs.terraform_action != 'destroy' }}
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Compile, Package & Test Backend Services
      if: ${{ github.event_name == 'push' || github.event.inputs.terraform_action != 'destroy' }}
      run: |
        mvn clean package -f discovery-server/pom.xml
        mvn clean package -f config-server/pom.xml
        mvn clean package -f api-gateway/pom.xml
        mvn clean package -f auth-service/pom.xml
        mvn clean package -f ticket-service/pom.xml

    # 6. ECR Login
    - name: Login to Amazon ECR
      if: ${{ github.event_name == 'push' || github.event.inputs.terraform_action != 'destroy' }}
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # 7. Get the Git Commit SHA
    - name: Get Commit SHA
      id: vars
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    # 8. Build and Push images to ECR
    - name: Build and Push Docker Images
      if: ${{ github.event_name == 'push' || github.event.inputs.terraform_action != 'destroy' }}
      run: |
        docker build -t ${{ steps.login-ecr.outputs.registry }}/discovery-server:${{ steps.vars.outputs.sha_short }} ./discovery-server
        docker push ${{ steps.login-ecr.outputs.registry }}/discovery-server:${{ steps.vars.outputs.sha_short }}

        docker build -t ${{ steps.login-ecr.outputs.registry }}/config-server:${{ steps.vars.outputs.sha_short }} -f ./config-server/Dockerfile .
        docker push ${{ steps.login-ecr.outputs.registry }}/config-server:${{ steps.vars.outputs.sha_short }}

        docker build -t ${{ steps.login-ecr.outputs.registry }}/api-gateway:${{ steps.vars.outputs.sha_short }} ./api-gateway
        docker push ${{ steps.login-ecr.outputs.registry }}/api-gateway:${{ steps.vars.outputs.sha_short }}

        docker build -t ${{ steps.login-ecr.outputs.registry }}/auth-service:${{ steps.vars.outputs.sha_short }} ./auth-service
        docker push ${{ steps.login-ecr.outputs.registry }}/auth-service:${{ steps.vars.outputs.sha_short }}

        docker build -t ${{ steps.login-ecr.outputs.registry }}/ticket-service:${{ steps.vars.outputs.sha_short }} ./ticket-service
        docker push ${{ steps.login-ecr.outputs.registry }}/ticket-service:${{ steps.vars.outputs.sha_short }}

    # 9. Run Terraform Apply or Destroy
    - name: Run Terraform Action
      id: tf_run
      run: |
        cd terraform
        ACTION="${{ github.event.inputs.terraform_action }}"
        if [ -z "$ACTION" ]; then
          ACTION="apply"
        fi
        
        if [ "$ACTION" == "destroy" ]; then
          terraform destroy -auto-approve -var="image_tag=${{ steps.vars.outputs.sha_short }}"
        else
          terraform apply -auto-approve -var="image_tag=${{ steps.vars.outputs.sha_short }}"
          
          # Output outputs for S3 bucket upload
          echo "s3_bucket=$(terraform output -raw s3_bucket_name)" >> $GITHUB_OUTPUT
          echo "cf_url=$(terraform output -raw cloudfront_domain_name)" >> $GITHUB_OUTPUT
        fi

    # 10. Build & Upload Frontend to S3 (M4 Servicing)
    - name: Build & Sync React UI
      if: ${{ success() && (github.event_name == 'push' || github.event.inputs.terraform_action != 'destroy') }}
      run: |
        ALB_HOST=$(cd terraform && terraform output -raw alb_hostname)
        sed -i "s|baseURL: '/api/v1'|baseURL: 'http://${ALB_HOST}/api/v1'|g" ticketdesk-ui/src/services/api.js
        cd ticketdesk-ui
        npm install
        npm run build
        aws s3 sync dist/ s3://${{ steps.tf_run.outputs.s3_bucket }} --delete

    # 11. Run Post-Deployment Smoke Test (M6 Requirement)
    - name: Run URL Smoke Test
      if: ${{ success() && (github.event_name == 'push' || github.event.inputs.terraform_action != 'destroy') }}
      run: |
        CF_URL="${{ steps.tf_run.outputs.cf_url }}"
        echo "Running smoke test against http://${CF_URL}..."
        curl -f -k -s "http://${CF_URL}" || (echo "Smoke test failed to load website" && exit 1)

    # 12. Commit and save the state file
    - name: Commit State File
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add terraform/terraform.tfstate || true
        git commit -m "Update Terraform state after build [skip ci]" || true
        git push || true